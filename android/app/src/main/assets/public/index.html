  <body>
    <div id="root"></div>
    <script>
      (function() {
        var cap = window.Capacitor;
        if (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform()) return;
        if (!('serviceWorker' in navigator)) return;
        window.addEventListener('load', function() {
          try {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(function(reg) {
                console.log('[ABSU Connect] Service worker active, scope:', reg.scope);
              })
              .catch(function(err) {
                console.warn('[ABSU Connect] SW registration notice:', err);
              });
          } catch (e) {
            console.warn('[ABSU Connect] SW registration skipped:', e);
          }
        });
      })();
    </script>
